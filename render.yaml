services:
  - type: web
    name: heartguard-hdps
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_USERNAME
        value: salamiameer663@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: heartguard-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: heartguard-db
    databaseName: heartguard
    user: heartguard
    plan: free
